name: matule
description: "WorldSkills 2026 Mobile Application Development ex Flutter"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  http: ^1.6.0
  path: ^1.9.1
  uuid: ^4.6.0
  sqflite: ^2.4.4
  go_router: ^17.0.0
  url_launcher: ^6.3.2
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5

  matule_uikit:
    path: ./packages/matule_uikit

  matule_api:
    path: ./packages/matule_api

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
